name: Build
on:
  push:
    branches: [deepseek-cloudflare]
  pull_request:
    branches: [deepseek-cloudflare]
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx vitest run test/deepseek.test.ts test/zhongdiwa-diagnostics.test.ts
      - run: npm run build:node
      - run: npm run typecheck:worker
      - run: npm run build:worker
